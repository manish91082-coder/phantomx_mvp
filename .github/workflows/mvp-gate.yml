name: PHANTOMX MVP Gate

on:
  push:
    branches: [master, 'phantomx/**']
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test runner
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Deterministic economic tests
        run: python -m pytest
